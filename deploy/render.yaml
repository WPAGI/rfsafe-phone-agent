# Blueprint for the service already deployed at rfsafe-phone-agent.onrender.com.
# PA_MODE stays demo until the steps in GO-LIVE.md. Syncing this file does not buy a number or call Twilio or xAI.
services:
  - type: web
    name: rfsafe-phone-agent
    runtime: node
    plan: starter
    region: virginia
    buildCommand: "npm test"
    startCommand: "node bin/server.js"
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PA_MODE
        value: demo
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TENANTS_DIR
        value: /var/data/tenants
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PA_ADMIN_TOKEN
        sync: false
      - key: PA_STATE_SECRET
        sync: false
      - key: PA_MASTER_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_TEXT_MODEL
        value: grok-4.7
      - key: RFSAFE_XAI_WEBHOOK_SECRET
        sync: false
      - key: RFSAFE_TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: RFSAFE_PHONE_NUMBER
        sync: false
      - key: RFSAFE_SHOPIFY_STOREFRONT_TOKEN
        sync: false
